[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glocel"
version = "1.0.0"
description = "Inventory, sales and customer management for an imported-parts business"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.1",
]

[tool.setuptools.packages.find]
include = ["GLOCEL*"]

# Vercel zero-config Flask entrypoint: the `app` object in GLOCEL/app.py.
[tool.vercel]
entrypoint = "GLOCEL.app:app"
