{% extends 'base.html' %}
{% block title %}Sign in - GLOCEL{% endblock %}
{% block main %}
<div class="auth-wrap">
    <div class="card auth-card shadow-lg">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <img class="logo mb-2" src="{{ url_for('static', filename='icon.svg') }}" alt="GLOCEL">
                <h1 class="h4 fw-bold mb-0">GLOCEL</h1>
                <div class="text-muted small">Sign in to manage stock, sales and customers</div>
            </div>
            {% include '_flash.html' %}
            <form method="post" autocomplete="on">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" name="username" class="form-control form-control-lg" autocomplete="username" autocapitalize="none" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input id="password" type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password'" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
                    <label class="form-check-label small" for="remember">Keep me signed in on this device</label>
                </div>
                <button class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right me-1"></i> Sign in</button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">Forgot your password? Ask an admin to reset it.</p>
        </div>
    </div>
</div>
{% endblock %}
